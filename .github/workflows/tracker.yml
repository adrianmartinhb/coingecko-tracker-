name: CoinGecko Volume Spike Tracker

on:
  schedule:
    # Runs every 5 minutes in GitHub's cloud (24/7 even when your Mac is off)
    - cron: "*/5 * * * *"
  workflow_dispatch: # Allows manual one-click testing from the GitHub Actions tab

permissions:
  contents: write

jobs:
  check-volume-spikes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run CoinGecko Volume Spike Check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 volume_spike_tracker.py --no-desktop-notify

      - name: Save alerted coins state (prevents duplicate alerts)
        run: |
          if [ -n "$(git status --porcelain seen_alerts.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add seen_alerts.json
            git commit -m "chore: update seen_alerts.json [skip ci]"
            git pull --rebase || true
            git push
          fi
